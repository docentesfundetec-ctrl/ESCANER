<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocScan - Escáner Local</title>
    <meta name="description" content="Aplicación PWA para escanear y organizar papeleo de forma local.">
    
    <!-- PWA Meta Tags para móviles -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DocScan">
    
    <!-- Enlaces para PWA real en GitHub (Se usarán cuando subas los archivos extra) -->
    <link rel="manifest" href="manifest.json" id="manifest-link">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Librerías de exportación: jsPDF, JSZip, y docx -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            overscroll-behavior-y: none; /* Previene "pull to refresh" molesto en móviles */
            -webkit-tap-highlight-color: transparent; /* Quita el destello azul al tocar en Android */
        }
        
        #camera-stream {
            object-fit: cover;
            width: 100%;
            height: 100%;
            border-radius: 0.75rem;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        button, input { touch-action: manipulation; }

        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        .camera-flash { animation: flash 0.3s ease-out; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-slate-100">

    <header class="bg-slate-800 text-white p-3 shadow-md z-10 flex justify-between items-center shrink-0 border-b border-slate-700 pb-safe">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <h1 class="text-lg font-bold tracking-wide">DocScan</h1>
        </div>
        <div class="flex items-center space-x-2 bg-slate-700 px-3 py-1 rounded-full">
            <span class="text-xs">Páginas:</span>
            <span id="photo-count" class="text-blue-400 font-bold text-sm">0</span>
        </div>
    </header>

    <main class="flex-1 flex flex-col relative overflow-hidden bg-black">
        <div id="camera-container" class="relative flex-1 w-full flex flex-col justify-center items-center overflow-hidden">
            <video id="camera-stream" autoplay playsinline muted></video>
            <div id="flash-overlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-10"></div>
            
            <!-- Guías visuales -->
            <div class="absolute inset-6 border-2 border-white/30 border-dashed rounded-xl pointer-events-none flex flex-col justify-between p-4 z-0">
                <div class="flex justify-between w-full">
                    <div class="w-10 h-10 border-t-4 border-l-4 border-blue-500 rounded-tl-lg"></div>
                    <div class="w-10 h-10 border-t-4 border-r-4 border-blue-500 rounded-tr-lg"></div>
                </div>
                <div class="flex justify-between w-full">
                    <div class="w-10 h-10 border-b-4 border-l-4 border-blue-500 rounded-bl-lg"></div>
                    <div class="w-10 h-10 border-b-4 border-r-4 border-blue-500 rounded-br-lg"></div>
                </div>
            </div>

            <div id="camera-error" class="absolute inset-0 flex flex-col items-center justify-center text-white text-center p-6 hidden bg-slate-900/95 z-20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-red-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <p class="text-lg font-semibold">Cámara no disponible</p>
                <p class="text-sm text-slate-300 mt-2">Por favor, otorga permisos en tu navegador e intenta recargar. En iPhone usa Safari.</p>
            </div>
        </div>
        
        <!-- Botón de captura -->
        <div class="absolute bottom-8 left-0 right-0 flex justify-center z-10 pointer-events-none">
            <button id="capture-btn" class="pointer-events-auto w-20 h-20 bg-white/20 rounded-full border-4 border-white shadow-2xl flex items-center justify-center active:scale-90 transition-transform backdrop-blur-md">
                <div class="w-14 h-14 bg-white rounded-full shadow-inner"></div>
            </button>
        </div>
    </main>

    <div class="h-56 bg-slate-800 border-t border-slate-700 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.3)] shrink-0 flex flex-col z-20 pb-safe">
        <div class="flex justify-between items-center px-4 py-3 border-b border-slate-700/80">
            <h2 class="text-sm text-slate-300 font-medium">Documentos listos</h2>
            <button id="export-btn" class="bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white text-sm font-bold py-2.5 px-6 rounded-full shadow-lg transition-transform active:scale-95 flex items-center gap-2" disabled>
                <span>Exportar</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            </button>
        </div>
        
        <div class="flex-1 flex items-center px-4 overflow-x-auto hide-scrollbar gap-4 py-3" id="gallery">
            <p id="empty-state" class="text-slate-500 text-sm italic w-full text-center">Toma fotos para empezar a organizar.</p>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="bg-slate-800 border border-slate-600 p-6 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-full transform scale-95 transition-transform duration-300" id="modal-content">
            <!-- Dinámico -->
        </div>
    </div>

    <script>
        let photos = [];
        let stream = null;

        const video = document.getElementById('camera-stream');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const gallery = document.getElementById('gallery');
        const emptyState = document.getElementById('empty-state');
        const photoCountBadge = document.getElementById('photo-count');
        const exportBtn = document.getElementById('export-btn');
        const cameraErrorMsg = document.getElementById('camera-error');
        const flashOverlay = document.getElementById('flash-overlay');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');

        // Registro de Service Worker para GitHub Pages (Silencioso si falla localmente)
        if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.protocol === 'https:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(()=> console.log("SW omitido en vista previa local."));
            });
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                cameraErrorMsg.classList.add('hidden');
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                cameraErrorMsg.classList.remove('hidden');
            }
        }

        function showModal(htmlContent) {
            modalContent.innerHTML = htmlContent;
            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modalOverlay.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
            }, 300);
        }

        document.getElementById('capture-btn').addEventListener('click', () => {
            if (!video.srcObject) return;
            
            flashOverlay.classList.remove('camera-flash');
            void flashOverlay.offsetWidth;
            flashOverlay.classList.add('camera-flash');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imgData = canvas.toDataURL('image/jpeg', 0.8);
            
            photos.push({ 
                id: Date.now(), 
                data: imgData,
                title: `Página ${photos.length + 1}`,
                width: canvas.width,
                height: canvas.height
            });
            updateGallery();
        });

        function updateGallery() {
            gallery.innerHTML = '';
            
            if (photos.length === 0) {
                gallery.appendChild(emptyState);
                emptyState.style.display = 'block';
                exportBtn.disabled = true;
            } else {
                emptyState.style.display = 'none';
                exportBtn.disabled = false;
                
                photos.forEach((photo, index) => {
                    const itemContainer = document.createElement('div');
                    itemContainer.className = 'flex flex-col gap-2 shrink-0 items-center w-28';

                    const thumbWrapper = document.createElement('div');
                    thumbWrapper.className = 'relative w-24 h-32 shrink-0 rounded-xl overflow-hidden border-2 border-slate-600 shadow-lg';
                    
                    const img = document.createElement('img');
                    img.src = photo.data;
                    img.className = 'w-full h-full object-cover';
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'absolute top-1.5 right-1.5 bg-red-500/90 hover:bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-md backdrop-blur-sm z-10 active:scale-75 transition-all';
                    deleteBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                        </svg>`;
                    deleteBtn.onclick = () => {
                        photos = photos.filter(p => p.id !== photo.id);
                        photos.forEach((p, i) => { if(p.title.startsWith('Página ')) p.title = `Página ${i + 1}`; });
                        updateGallery();
                    };
                    
                    const pageBadge = document.createElement('div');
                    pageBadge.className = 'absolute bottom-1.5 left-1.5 bg-black/70 text-white text-xs font-bold px-2 py-1 rounded-md backdrop-blur-md';
                    pageBadge.textContent = `${index + 1}`;

                    thumbWrapper.appendChild(img);
                    thumbWrapper.appendChild(deleteBtn);
                    thumbWrapper.appendChild(pageBadge);
                    
                    const nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.value = photo.title;
                    nameInput.className = 'w-full bg-slate-700 text-white text-xs px-2 py-2 rounded-lg border border-slate-500 focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 text-center shadow-inner transition-colors';
                    // Evitar que el teclado oculte el input al hacer foco
                    nameInput.onfocus = () => setTimeout(() => itemContainer.scrollIntoView({behavior: 'smooth', block: 'nearest'}), 300);
                    nameInput.onchange = (e) => { photo.title = e.target.value.trim() || `Página ${index + 1}`; };

                    itemContainer.appendChild(thumbWrapper);
                    itemContainer.appendChild(nameInput);
                    gallery.appendChild(itemContainer);
                });
                
                gallery.scrollLeft = gallery.scrollWidth;
            }
            photoCountBadge.textContent = photos.length;
        }

        exportBtn.addEventListener('click', () => {
            if (photos.length === 0) return;
            const dateStr = new Date().toISOString().slice(0,10).replace(/-/g, "");
            
            showModal(`
                <h3 class="text-xl font-bold text-white w-full text-center mb-4">Exportar Documentos</h3>
                
                <div class="w-full mb-6">
                    <label class="block text-xs text-slate-400 mb-2 font-medium">Nombre del expediente:</label>
                    <input type="text" id="doc-name" value="Expediente_${dateStr}" class="w-full bg-slate-700 text-white text-lg px-4 py-3.5 rounded-xl border-2 border-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
                </div>

                <div class="flex flex-col gap-3 w-full">
                    <button onclick="processExport('pdf')" class="w-full bg-red-600 hover:bg-red-500 text-white py-4 rounded-xl text-base font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                        📄 Descargar PDF
                    </button>
                    
                    <button onclick="processExport('word')" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl text-base font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                        📝 Descargar Word (.docx)
                    </button>

                    <button onclick="processExport('zip')" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-4 rounded-xl text-base font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                        🗂️ Descargar ZIP (Fotos separadas)
                    </button>
                </div>
                
                <button onclick="closeModal()" class="mt-4 text-slate-400 hover:text-white font-medium py-3 w-full active:bg-slate-700 rounded-xl transition-colors">Cancelar</button>
            `);
        });

        window.processExport = async (format) => {
            const docName = document.getElementById('doc-name').value.trim() || 'Documentos';
            
            showModal(`
                <div class="animate-spin rounded-full h-14 w-14 border-4 border-slate-600 border-t-blue-500 mb-4"></div>
                <h3 class="text-xl font-bold text-white">Procesando...</h3>
                <p class="text-sm text-slate-400 mt-2 text-center">Generando ${format.toUpperCase()} localmente.</p>
            `);
            
            setTimeout(async () => {
                try {
                    if (format === 'pdf') {
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                        const pdfWidth = doc.internal.pageSize.getWidth();
                        const pdfHeight = doc.internal.pageSize.getHeight();

                        photos.forEach((photo, index) => {
                            if (index > 0) doc.addPage();
                            const imgProps = doc.getImageProperties(photo.data);
                            const ratio = imgProps.width / imgProps.height;
                            let finalW = pdfWidth; let finalH = pdfHeight;
                            
                            if(ratio > (pdfWidth / pdfHeight)) finalH = pdfWidth / ratio;
                            else finalW = pdfHeight * ratio;
                            
                            const x = (pdfWidth - finalW) / 2;
                            const y = (pdfHeight - finalH) / 2;
                            doc.addImage(photo.data, 'JPEG', x, y, finalW, finalH, undefined, 'FAST');
                            
                            // Imprimir título de la página en la esquina superior izquierda
                            doc.setFontSize(10);
                            doc.setTextColor(150);
                            doc.text(photo.title, 10, 10);
                        });
                        doc.save(`${docName}.pdf`);
                        
                    } else if (format === 'word') {
                        const docSections = [];
                        
                        for (let i = 0; i < photos.length; i++) {
                            const photo = photos[i];
                            const fetchRes = await fetch(photo.data);
                            const blob = await fetchRes.blob();
                            const arrayBuffer = await blob.arrayBuffer();

                            const maxW = 600;
                            const ratio = photo.width / photo.height;
                            let finalW = maxW;
                            let finalH = maxW / ratio;
                            
                            if (finalH > 800) { finalH = 800; finalW = finalH * ratio; }

                            docSections.push(
                                new docx.Paragraph({ children: [new docx.TextRun({ text: photo.title, bold: true, size: 28 })], spacing: { after: 200 } }),
                                new docx.Paragraph({ children: [new docx.ImageRun({ data: arrayBuffer, transformation: { width: finalW, height: finalH } })] })
                            );
                            
                            if (i < photos.length - 1) docSections.push(new docx.Paragraph({ children: [new docx.PageBreak()] }));
                        }

                        const wordDoc = new docx.Document({ sections: [{ properties: {}, children: docSections }] });
                        const blob = await docx.Packer.toBlob(wordDoc);
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url; a.download = `${docName}.docx`; a.click(); URL.revokeObjectURL(url);

                    } else if (format === 'zip') {
                        const zip = new JSZip();
                        photos.forEach((photo, i) => {
                            const base64Data = photo.data.replace(/^data:image\/(png|jpeg|jpg);base64,/, "");
                            const safeTitle = photo.title.replace(/[^a-z0-9A-Z]/gi, '_');
                            zip.file(`${String(i + 1).padStart(2, '0')}_${safeTitle}.jpg`, base64Data, {base64: true});
                        });
                        
                        const content = await zip.generateAsync({type: "blob"});
                        const url = URL.createObjectURL(content);
                        const a = document.createElement("a");
                        a.href = url; a.download = `${docName}.zip`; a.click(); URL.revokeObjectURL(url);
                    }
                    
                    showSuccessModal();
                    
                } catch (error) {
                    console.error("Error:", error);
                    showModal(`
                        <div class="text-5xl mb-3">❌</div>
                        <h3 class="text-xl font-bold text-white">Error de sistema</h3>
                        <button onclick="closeModal()" class="w-full mt-6 bg-slate-700 text-white py-3 rounded-xl">Cerrar</button>
                    `);
                }
            }, 100);
        };

        function showSuccessModal() {
            showModal(`
                <div class="text-6xl mb-4">✅</div>
                <h3 class="text-xl font-bold text-white text-center">¡Archivo Generado!</h3>
                <p class="text-sm text-slate-400 mt-2 text-center mb-8">Revisa tus descargas.</p>
                <div class="flex flex-col gap-3 w-full">
                    <button id="btn-keep" class="bg-slate-700 hover:bg-slate-600 text-white py-3.5 rounded-xl text-sm font-bold transition-colors w-full">Seguir editando</button>
                    <button id="btn-clear" class="bg-red-600 hover:bg-red-500 text-white py-3.5 rounded-xl text-sm font-bold transition-colors w-full">Borrar fotos y empezar de cero</button>
                </div>
            `);
            document.getElementById('btn-keep').onclick = closeModal;
            document.getElementById('btn-clear').onclick = () => { photos = []; updateGallery(); closeModal(); };
        }

        window.addEventListener('load', startCamera);
        window.addEventListener('beforeunload', () => { if (stream) stream.getTracks().forEach(track => track.stop()); });
    </script>
</body>
</html>
